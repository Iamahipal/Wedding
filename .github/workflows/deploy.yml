name: Deploy to GitHub Pages

# Manual only. Vercel is the live host now; leaving the push trigger on meant
# every commit queued a second deploy against a Pages site that is no longer
# configured, which just fills the Actions tab with hung runs. Kept rather than
# deleted so Pages remains a one-click fallback.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time — and crucially, in-progress runs are NOT cancelled.
#
# `cancel-in-progress: true` is the right default almost everywhere and is
# wrong here. Cancelling a run that is already inside actions/deploy-pages
# kills it while the Pages API still holds the deployment lock, and the *next*
# run then sits in "Run actions/deploy-pages" indefinitely waiting for a lock
# nobody will ever release. The build goes green, the deploy hangs forever.
#
# Pushing several commits in a row is exactly what triggers it. GitHub's own
# starter workflow sets this to false for this reason.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Emits base_path — "/<repo>" for a project page, "" for a user page.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # TRAP 24. A GitHub *project* page is served from /<repo>/, not from the
      # domain root. Next rewrites the URLs it generates itself, but not the
      # ones we build by hand — those go through lib/basePath.ts, which reads
      # this. Get it wrong and everything works locally and 404s in production.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute, for the og:image. Crawlers ignore relative ones, and the
          # share card is how this invitation actually reaches people.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      # Pages runs Jekyll by default, and Jekyll silently drops every directory
      # beginning with an underscore — which is all of _next. Without this file
      # the HTML deploys and every script and stylesheet 404s.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
