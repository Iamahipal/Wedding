<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The rosette already foiled on the front of the folio, on the film's own
    warm black. It exists mostly so the browser stops asking for /favicon.ico
    and getting a 404 — a static export has no fallback to give it — but a card
    that reaches people by being forwarded and opened in a tab should have
    something of its own in that tab.
  -->
  <rect width="100" height="100" fill="#050301"/>
  <g fill="#dcac52">
    <path d="M50 12c5 17 10 26 21 29-11 3-16 12-21 29-5-17-10-26-21-29 11-3 16-12 21-29Z"/>
    <path d="M12 50c17-5 26-10 29-21 3 11 12 16 29 21-17 5-26 10-29 21-3-11-12-16-29-21Z"/>
    <circle cx="50" cy="50" r="6"/>
  </g>
</svg>
